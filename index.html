<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eagle Master - Secure Payment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/payment.css" />

    <script>
        window.RUNTIME_CONFIG = {
            API_BASE: 'https://sharpness-payhero-backend.onrender.com',
            CHANNEL_ID: '9929'
        };
    </script>
</head>
<body>

    <main class="card">
        <header class="header">
            <div class="logo-icon">
                <i class="fas fa-dove"></i>
            </div>
            <h1>Eagle Master</h1>
            <p>Choose your payment method</p>
        </header>

        <form id="paymentForm" novalidate>
            <div class="form-group">
                <label for="phoneInput">
                    <i class="fas fa-phone-alt"></i> Phone Number
                </label>
                <div class="input-wrapper">
                    <span class="prefix">+254</span>
                    <input
                        type="tel"
                        id="phoneInput"
                        placeholder="712 345 678"
                        maxlength="15"
                        autocomplete="tel"
                        required
                    />
                </div>
            </div>

            <div class="form-group">
                <label for="amountInput">
                    <i class="fas fa-coins"></i> Amount (KES)
                </label>
                <div class="input-wrapper">
                    <input
                        type="number"
                        id="amountInput"
                        placeholder="0.00"
                        min="1"
                        step="0.01"
                        autocomplete="off"
                        required
                    />
                    <span class="currency">KES</span>
                </div>
            </div>

            <div class="form-group">
                <label for="nameInput">
                    <i class="fas fa-user"></i> Full Name (optional)
                </label>
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="nameInput"
                        placeholder="Jane Doe"
                        autocomplete="name"
                    />
                </div>
            </div>

            <div class="button-row">
                <button type="button" class="btn-pay" id="stkBtn">
                    <span class="btn-icon"><i class="fas fa-mobile-alt"></i></span>
                    <span class="btn-text">M-Pesa / Airtel</span>
                    <span class="spinner"></span>
                </button>

                <button type="button" class="btn-pay card-btn" id="cardBtn">
                    <span class="btn-icon"><i class="fas fa-credit-card"></i></span>
                    <span class="btn-text">Pay with Card</span>
                    <span class="spinner"></span>
                </button>
            </div>
        </form>

        <div class="status" id="statusMessage">
            <i class="fas fa-circle-info"></i>
            <span id="statusText">Fill in the details and choose a payment method.</span>
        </div>

        <p class="footer-text">
            <i class="fas fa-lock"></i> Secured by PayHero &bull; Visa / Mastercard &amp; Mobile Money
        </p>
    </main>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-icon">
                <i class="fas fa-receipt"></i>
            </div>
            <h2>Confirm Payment</h2>
            <p class="sub">Please verify the details below before continuing</p>

            <div class="detail-row">
                <span class="label"><i class="fas fa-phone-alt"></i> Phone</span>
                <span class="value phone" id="modalPhone">&mdash;</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="fas fa-coins"></i> Amount</span>
                <span class="value amount" id="modalAmount">&mdash;</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="fas fa-wifi"></i> Network</span>
                <span class="value provider" id="modalProvider">&mdash;</span>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel" type="button">Cancel</button>
                <button class="btn-confirm" id="modalConfirm" type="button">
                    <i class="fas fa-check"></i> Confirm &amp; Pay
                </button>
            </div>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
